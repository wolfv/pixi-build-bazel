[package]
name = "pixi-build-bazel"
version = "0.1.0"
edition = "2024"
description = "Experimental pixi build backend: every `conda_package` target of a Bazel workspace is a conda output"
license = "BSD-3-Clause"
publish = false

[dependencies]
fs-err = "3"
jsonrpc-core = "18.0.0"
jsonrpc-stdio-server = "18.0.0"
miette = { version = "7", features = ["fancy"] }
# The build protocol spoken by pixi v0.76.1.
pixi_build_types = { git = "https://github.com/prefix-dev/pixi", tag = "v0.76.1" }
rattler_conda_types = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
strip = true
