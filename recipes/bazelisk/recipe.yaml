# bazelisk is not on conda-forge: repackage the upstream release binaries.
context:
  version: "1.29.0"

package:
  name: bazelisk
  version: ${{ version }}

source:
  - if: linux and x86_64
    then:
      url: https://github.com/bazelbuild/bazelisk/releases/download/v${{ version }}/bazelisk-linux-amd64
      sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
      file_name: bazelisk
  - if: linux and aarch64
    then:
      url: https://github.com/bazelbuild/bazelisk/releases/download/v${{ version }}/bazelisk-linux-arm64
      sha256: e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010
      file_name: bazelisk
  - if: osx and x86_64
    then:
      url: https://github.com/bazelbuild/bazelisk/releases/download/v${{ version }}/bazelisk-darwin-amd64
      sha256: 16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007
      file_name: bazelisk
  - if: osx and arm64
    then:
      url: https://github.com/bazelbuild/bazelisk/releases/download/v${{ version }}/bazelisk-darwin-arm64
      sha256: cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409
      file_name: bazelisk

build:
  number: 0
  skip: win
  script:
    - mkdir -p "$PREFIX/bin"
    - install -m 755 bazelisk "$PREFIX/bin/bazelisk"
  # A prebuilt Go binary: leave it untouched.
  prefix_detection:
    ignore: true
  dynamic_linking:
    binary_relocation: false

tests:
  - package_contents:
      bin:
        - bazelisk

about:
  homepage: https://github.com/bazelbuild/bazelisk
  repository: https://github.com/bazelbuild/bazelisk
  license: Apache-2.0
  summary: A user-friendly launcher for Bazel (picks the version from .bazelversion)
