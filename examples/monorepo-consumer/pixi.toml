# A pixi workspace outside the Bazel repository, using its packages.
[workspace]
name = "greet-consumer"
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
# Outputs of the Bazel monorepo (could also be a git source).
greet-cli = { path = "../monorepo" }
py-greet = { path = "../monorepo" }
python = "3.13.*"

[tasks]
greet = "greet consumer"
py-greet = "python -c 'import greet; print(greet.greet(\"python \" + __import__(\"sys\").version.split()[0]))'"
