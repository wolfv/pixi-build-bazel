[package]
name = "conda_builder"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
jiff = "0.2"
rattler_conda_types = { version = "0.54", default-features = false }
rattler_digest = { version = "1.4", default-features = false }
rattler_package_streaming = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true
